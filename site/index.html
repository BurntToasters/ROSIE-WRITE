<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSIE-WRITE | Note Editor</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app" id="app">
        <!-- Left document rail -->
        <aside class="doc-rail" id="noteRail" aria-label="Notes">
            <div class="rail-head">
                <a href="/" aria-label="ROSIE-WRITE home"><img src="/assets/ROSIE-WRITE-logo.webp" alt="" class="rail-logo"></a>
                <span class="rail-brand">ROSIE-WRITE</span>
            </div>
            <div class="rail-actions">
                <button type="button" id="newNote" class="icon-btn new-btn" title="New Note"><i class="fas fa-plus" aria-hidden="true"></i> New</button>
                <button type="button" id="deleteNote" class="icon-btn danger" title="Delete Note" aria-label="Delete note"><i class="fas fa-trash" aria-hidden="true"></i></button>
                <button type="button" id="deleteAllNotes" class="icon-btn danger" title="Delete All Notes" aria-label="Delete all notes"><i class="fas fa-trash-alt" aria-hidden="true"></i></button>
            </div>
            <div class="rail-search">
                <input type="search" id="noteSearch" class="text-input" placeholder="Search notes…" aria-label="Search notes">
            </div>
            <div class="rail-list" id="railList"></div>
        </aside>

        <!-- Main column -->
        <div class="main">
            <div class="app-bar">
                <button type="button" id="railToggle" class="icon-btn rail-toggle" title="Notes" aria-label="Toggle notes sidebar" aria-controls="noteRail" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
                <input type="text" id="noteTitle" class="text-input note-title" placeholder="Untitled Note" aria-label="Note title">
                <div class="bar-spacer"></div>
                <div class="bar-actions">
                    <button type="button" id="exportBtn" class="icon-btn" title="Export" aria-label="Export note"><i class="fas fa-download" aria-hidden="true"></i></button>
                    <button type="button" id="importBtn" class="icon-btn" title="Import" aria-label="Import note"><i class="fas fa-upload" aria-hidden="true"></i></button>
                    <input type="file" id="importFile" accept=".txt,.html,.md" hidden>
                    <a href="/about" class="icon-btn" title="About" aria-label="About ROSIE-WRITE"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></a>
                    <a href="https://github.com/BurntToasters/ROSIE-WRITE" class="icon-btn" title="GitHub" aria-label="ROSIE-WRITE on GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>
                    <button type="button" id="toggleTheme" class="icon-btn" title="Toggle Theme" aria-label="Toggle color theme"><i class="fas fa-moon" aria-hidden="true"></i></button>
                </div>
            </div>

            <div class="toolbar" role="toolbar" aria-label="Text formatting">
                <button type="button" id="undoBtn" class="icon-btn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><i class="fas fa-undo" aria-hidden="true"></i></button>
                <button type="button" id="redoBtn" class="icon-btn" title="Redo (Ctrl/Cmd+Y)" aria-label="Redo"><i class="fas fa-redo" aria-hidden="true"></i></button>
                <span class="divider" role="separator" aria-orientation="vertical"></span>
                <div class="font-size-controls" aria-label="Font size controls">
                    <button type="button" id="fontDecreaseBtn" class="icon-btn" title="Decrease Font Size" aria-label="Decrease font size"><i class="fas fa-minus" aria-hidden="true"></i></button>
                    <span id="fontSizeIndicator" class="font-size-indicator">12pt</span>
                    <button type="button" id="fontIncreaseBtn" class="icon-btn" title="Increase Font Size" aria-label="Increase font size"><i class="fas fa-plus" aria-hidden="true"></i></button>
                </div>
                <span class="divider" role="separator" aria-orientation="vertical"></span>
                <button type="button" id="boldBtn" class="icon-btn" title="Bold (Ctrl/Cmd+B)" aria-label="Bold"><i class="fas fa-bold" aria-hidden="true"></i></button>
                <button type="button" id="italicBtn" class="icon-btn" title="Italic (Ctrl/Cmd+I)" aria-label="Italic"><i class="fas fa-italic" aria-hidden="true"></i></button>
                <button type="button" id="underlineBtn" class="icon-btn" title="Underline (Ctrl/Cmd+U)" aria-label="Underline"><i class="fas fa-underline" aria-hidden="true"></i></button>
                <span class="divider" role="separator" aria-orientation="vertical"></span>
                <button type="button" id="headingBtn" class="icon-btn" title="Heading" aria-label="Toggle heading"><i class="fas fa-heading" aria-hidden="true"></i></button>
                <button type="button" id="listBtn" class="icon-btn" title="Bullet List" aria-label="Toggle bullet list"><i class="fas fa-list-ul" aria-hidden="true"></i></button>
                <button type="button" id="numListBtn" class="icon-btn" title="Numbered List" aria-label="Toggle numbered list"><i class="fas fa-list-ol" aria-hidden="true"></i></button>
                <span class="divider" role="separator" aria-orientation="vertical"></span>
                <button type="button" id="alignLeftBtn" class="icon-btn" title="Align Left" aria-label="Align left"><i class="fas fa-align-left" aria-hidden="true"></i></button>
                <button type="button" id="alignCenterBtn" class="icon-btn" title="Align Center" aria-label="Align center"><i class="fas fa-align-center" aria-hidden="true"></i></button>
                <button type="button" id="alignRightBtn" class="icon-btn" title="Align Right" aria-label="Align right"><i class="fas fa-align-right" aria-hidden="true"></i></button>
                <span class="divider" role="separator" aria-orientation="vertical"></span>
                <button type="button" id="linkBtn" class="icon-btn" title="Insert Link (Ctrl/Cmd+K)" aria-label="Insert link"><i class="fas fa-link" aria-hidden="true"></i></button>
                <button type="button" id="imageBtn" class="icon-btn" title="Insert Image" aria-label="Insert image"><i class="fas fa-image" aria-hidden="true"></i></button>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>

            <main class="canvas" aria-label="Note editor">
                <div class="page">
                    <div id="pageContent"></div>
                </div>
            </main>

            <div class="status-bar">
                <span id="saveStatus" class="save-status" role="status" aria-live="polite" aria-atomic="true"><span class="status-dot" aria-hidden="true"></span><span class="status-text">All changes saved</span></span>
                <span id="wordCount" class="word-count">0 words | 0 characters</span>
                <a href="#" class="version-indicator" aria-label="Version and release notes"></a>
            </div>
        </div>
    </div>

    <!-- Link dialog -->
    <div id="linkDialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="linkDialogTitle" aria-hidden="true" tabindex="-1">
        <div class="dialog">
            <h3 id="linkDialogTitle">Insert Link</h3>
            <div class="link-form">
                <label for="linkText">Link Text</label>
                <input type="text" id="linkText" class="text-input" placeholder="Display text">
                <label for="linkUrl">URL</label>
                <input type="url" id="linkUrl" class="text-input" placeholder="https://example.com">
            </div>
            <div class="dialog-actions">
                <button type="button" id="cancelLink" class="btn">Cancel</button>
                <button type="button" id="insertLink" class="btn primary">Insert</button>
            </div>
        </div>
    </div>

    <!-- Export dialog -->
    <div id="exportFormatDialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="exportDialogTitle" aria-describedby="exportDialogDescription" aria-hidden="true" tabindex="-1">
        <div class="dialog">
            <h3 id="exportDialogTitle">Export Format</h3>
            <p id="exportDialogDescription">Choose the format to export your note:</p>
            <div class="format-options">
                <button type="button" data-format="html" class="format-btn">
                    <span><i class="fas fa-code" aria-hidden="true"></i> HTML (.html)</span>
                    <span class="format-desc">Preserves all formatting and structure</span>
                </button>
                <button type="button" data-format="md" class="format-btn">
                    <span><i class="fab fa-markdown" aria-hidden="true"></i> Markdown (.md)</span>
                    <span class="format-desc">Universal format with formatting preserved</span>
                </button>
                <button type="button" data-format="txt" class="format-btn">
                    <span><i class="fas fa-file-alt" aria-hidden="true"></i> Plain Text (.txt)</span>
                    <span class="format-desc">Text only, no formatting</span>
                </button>
                <button type="button" data-format="pdf" class="format-btn">
                    <span><i class="fas fa-file-pdf" aria-hidden="true"></i> PDF (.pdf)</span>
                    <span class="format-desc">Portable document with images (can't be re-imported)</span>
                </button>
                <button type="button" data-format="rtf" class="format-btn">
                    <span><i class="fas fa-file-word" aria-hidden="true"></i> Rich Text (.rtf)</span>
                    <span class="format-desc">Word-compatible format with images (can't be re-imported)</span>
                </button>
            </div>
            <div class="dialog-actions">
                <button type="button" id="cancelExport" class="btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Confirmation dialog -->
    <div id="confirmDialog" class="dialog-overlay" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage" aria-hidden="true" tabindex="-1">
        <div class="dialog">
            <h3 id="confirmTitle">Confirm Action</h3>
            <p id="confirmMessage">Are you sure you want to proceed?</p>
            <div class="dialog-actions">
                <button type="button" id="cancelConfirm" class="btn">Cancel</button>
                <button type="button" id="okConfirm" class="btn primary danger">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast notification container -->
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
